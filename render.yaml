services:
  - type: web
    name: hrms-backend
    env: docker
    dockerfilePath: ./my-hrms-project/backend/Dockerfile
    healthCheckPath: /health
    branch: main
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "5000"
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY
  - type: web
    name: hrms-frontend
    env: docker
    dockerfilePath: ./my-hrms-project/frontend/Dockerfile
    staticPublishPath: /usr/share/nginx/html
    branch: main
    envVars:
      - key: VITE_API_URL
        value: "https://hrms-backend.onrender.com"
