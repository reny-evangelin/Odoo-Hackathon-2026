services:
  - type: web
    name: dayflow-hrms
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    branch: main
    envVars:
      - key: PORT
        value: "5000"
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY

