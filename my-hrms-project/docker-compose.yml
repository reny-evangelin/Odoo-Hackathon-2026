version: '3.8'

services:
  hrms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-backend-service
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  hrms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms-frontend-app
    ports:
      - "3000:80"
    depends_on:
      - hrms-backend
    environment:
      - VITE_API_URL=http://localhost:5000
    restart: unless-stopped
